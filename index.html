<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TactFlow · 数据合规路由引擎</title>
<style>
  :root { --bg: #0d1117; --surface: #161b22; --border: #30363d; --text: #e6edf3; --muted: #8b949e; --accent: #58a6ff; --green: #3fb950; --yellow: #d29922; --red: #f85149; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }
  .container { max-width: 720px; margin: 0 auto; padding: 16px; }
  header { display: flex; align-items: center; justify-content: space-between; padding: 12px 0; border-bottom: 1px solid var(--border); margin-bottom: 16px; }
  header h1 { font-size: 18px; font-weight: 600; }
  .badge { font-size: 11px; padding: 2px 8px; border-radius: 10px; background: var(--surface); border: 1px solid var(--border); color: var(--muted); }
  .toggle-row { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); }
  .toggle-row input[type="checkbox"] { accent-color: var(--accent); }
  label { font-size: 13px; color: var(--muted); display: block; margin-bottom: 6px; }
  textarea { width: 100%; min-height: 120px; padding: 12px; border-radius: 8px; border: 1px solid var(--border); background: var(--surface); color: var(--text); font-size: 14px; resize: vertical; font-family: inherit; }
  textarea:focus { outline: none; border-color: var(--accent); }
  select { width: 100%; padding: 10px 12px; border-radius: 8px; border: 1px solid var(--border); background: var(--surface); color: var(--text); font-size: 14px; appearance: none; }
  .row { display: flex; gap: 12px; margin-top: 12px; }
  .row > * { flex: 1; }
  button { width: 100%; margin-top: 16px; padding: 12px; border-radius: 8px; border: none; background: var(--accent); color: #fff; font-size: 15px; font-weight: 600; cursor: pointer; }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  .result { margin-top: 20px; padding: 16px; border-radius: 8px; background: var(--surface); border: 1px solid var(--border); display: none; }
  .result.show { display: block; }
  .result h2 { font-size: 15px; margin-bottom: 10px; }
  .score { font-size: 32px; font-weight: 700; }
  .score.high { color: var(--red); }
  .score.mid { color: var(--yellow); }
  .score.low { color: var(--green); }
  .field-list { margin-top: 12px; }
  .field-item { padding: 8px 0; border-bottom: 1px solid var(--border); font-size: 13px; }
  .field-item:last-child { border-bottom: none; }
  .field-item .type { color: var(--accent); font-weight: 500; }
  .field-item .risk { float: right; padding: 1px 6px; border-radius: 4px; font-size: 11px; font-weight: 600; }
  .risk.high { background: #3d1f1f; color: var(--red); }
  .risk.mid { background: #3d2e1f; color: var(--yellow); }
  .risk.low { background: #1f3d1f; color: var(--green); }
  .summary { margin-top: 12px; padding: 10px; border-radius: 6px; background: var(--bg); font-size: 13px; color: var(--muted); }
  .tech-detail { margin-top: 12px; font-size: 12px; color: var(--muted); white-space: pre-wrap; word-break: break-all; max-height: 200px; overflow-y: auto; }
  .error { color: var(--red); font-size: 13px; margin-top: 12px; }
  .loading { text-align: center; padding: 20px; color: var(--muted); }
</style>
</head>
<body>
<div class="container">
  <header>
    <h1>TactFlow</h1>
    <div style="display:flex;align-items:center;gap:10px;">
      <span class="badge">v1.0</span>
      <div class="toggle-row">
        <input type="checkbox" id="techToggle">
        <label for="techToggle" style="margin:0;">技术视角</label>
      </div>
    </div>
  </header>
  <label for="inputText">待检查文本</label>
  <textarea id="inputText" placeholder="粘贴或输入需要合规检查的文本内容…"></textarea>
  <div class="row">
    <div>
      <label for="country">目标法规</label>
      <select id="country">
        <option value="CN">中国 PIPL</option>
        <option value="SG">新加坡 PDPA</option>
      </select>
    </div>
    <div>
      <label for="model">AI模型</label>
      <select id="model">
        <option value="deepseek/deepseek-v4-flash">DeepSeek V4 Flash</option>
      </select>
    </div>
  </div>
  <button id="checkBtn" onclick="runCheck()">开始检查</button>
  <div id="resultBox" class="result">
    <h2>合规检查结果</h2>
    <div id="scoreArea"></div>
    <div id="fieldList" class="field-list"></div>
    <div id="summary" class="summary"></div>
    <div id="techDetail" class="tech-detail" style="display:none;"></div>
  </div>
  <div id="errorMsg" class="error" style="display:none;"></div>
</div>
<script>
const PROXY_URL = "/api/compliance";
const AUTH_TOKEN = "tactflow-demo-2026";
async function runCheck() {
  const text = document.getElementById('inputText').value.trim();
  const country = document.getElementById('country').value;
  const model = document.getElementById('model').value;
  const btn = document.getElementById('checkBtn');
  const resultBox = document.getElementById('resultBox');
  const errorMsg = document.getElementById('errorMsg');
  if (!text) { alert('请输入待检查文本'); return; }
  btn.disabled = true;
  btn.textContent = '检查中…';
  errorMsg.style.display = 'none';
  resultBox.classList.remove('show');
  try {
    const resp = await fetch(PROXY_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'X-Auth-Token': AUTH_TOKEN },
      body: JSON.stringify({ text, country, model })
    });
    const data = await resp.json();
    if (!resp.ok || data.error) { throw new Error(data.error || `HTTP ${resp.status}`); }
    renderResult(data);
  } catch (e) {
    errorMsg.textContent = '检查失败：' + e.message;
    errorMsg.style.display = 'block';
  } finally {
    btn.disabled = false;
    btn.textContent = '开始检查';
  }
}
function renderResult(data) {
  const result = data.result || {};
  const score = result.risk_score || result.compliance_score || 0;
  const fields = result.fields || [];
  const summary = result.risk_summary || '';
  const isCompliance = 'compliance_score' in result;
  const displayScore = isCompliance ? score : (100 - score);
  const scoreEl = document.getElementById('scoreArea');
  const level = displayScore >= 80 ? 'low' : displayScore >= 50 ? 'mid' : 'high';
  scoreEl.innerHTML = `<span class="score ${level}">${displayScore}</span><span style="color:var(--muted);font-size:13px;margin-left:8px;">/100 合规分</span>`;
  const fieldEl = document.getElementById('fieldList');
  fieldEl.innerHTML = fields.map(f => {
    const r = (f.risk_level || '').includes('高') ? 'high' : (f.risk_level || '').includes('中') ? 'mid' : 'low';
    return `<div class="field-item"><span class="type">${f.field_type || ''}</span> ${f.original_value || ''} → ${f.desensitized_value || ''} <span class="risk ${r}">${f.risk_level || ''}</span></div>`;
  }).join('');
  document.getElementById('summary').textContent = summary;
  document.getElementById('techDetail').textContent = JSON.stringify(data, null, 2);
  document.getElementById('resultBox').classList.add('show');
}
document.getElementById('techToggle').addEventListener('change', function() {
  document.getElementById('techDetail').style.display = this.checked ? 'block' : 'none';
});
</script>
</body>
</html>
